name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            artifact: mac-x64
            cmd: pnpm run pack:mac:x64
          - os: macos-14
            artifact: mac-arm64
            cmd: pnpm run pack:mac:arm64
          - os: windows-2022
            artifact: win-x64
            cmd: pnpm run pack:win:x64
          - os: ubuntu-22.04
            artifact: linux-x64
            cmd: pnpm run pack:linux:x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build artifact
        run: ${{ matrix.cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-electron/**