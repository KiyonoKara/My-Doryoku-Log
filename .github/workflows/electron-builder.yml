name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      DATABASE_URL: local.db

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            runner: macos-15-intel
            build_script: pack:mac:x64:dmg

          - name: macOS arm64
            runner: macos-14
            build_script: pack:mac:arm64:dmg

          - name: Windows x64
            runner: windows-2022
            build_script: pack:win:x64

          - name: Linux x64
            runner: ubuntu-24.04
            build_script: pack:linux:x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show versions
        run: |
          node -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check app
        run: |
          pnpm check
          pnpm test

      - name: Build package
        run: pnpm run ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: local.db

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist-electron/**/*
          if-no-files-found: error
