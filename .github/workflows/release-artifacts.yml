name: Attach build artifacts to a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.0.1 or 0.0.1'
        required: true
        type: string
      run_id:
        description: 'Workflow run ID from desktop app packaging workflow'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-24.04

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          RUN_ID="${{ inputs.run_id }}"

          if [[ ! "$TAG" =~ ^(v)?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like 0.0.1 or v0.0.1"
            exit 1
          fi

          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "run_id must be numeric"
            exit 1
          fi

      - name: Download all artifacts from build run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          path: release-artifacts
          merge-multiple: true

      - name: Verify downloads
        shell: bash
        run: |
          set -euo pipefail
          find release-artifacts -type f | sort
          test -n "$(find release-artifacts -type f -print -quit)"

      - name: Check whether release exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release if missing
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.tag }}" \
            --notes "Release assets uploaded from workflow run ${{ inputs.run_id }}."

      - name: Upload files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            gh release upload "${{ inputs.tag }}" "$file" --clobber
          done < <(find release-artifacts -type f -print0)

      - name: Show release URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release view "${{ inputs.tag }}" --json url --jq '.url'