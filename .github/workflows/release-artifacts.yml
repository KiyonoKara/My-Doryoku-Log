name: Attach build artifacts to a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.0.1 or 0.0.1'
        required: true
        type: string
      run_id:
        description: 'Workflow run ID from desktop app packaging workflow'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
    
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          RUN_ID="${{ inputs.run_id }}"

          if [[ ! "$TAG" =~ ^(v)?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like 0.0.1 or v0.0.1"
            exit 1
          fi

          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "run_id must be numeric"
            exit 1
          fi

      - name: Download all artifacts from build run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          path: release-artifacts
          merge-multiple: true

      - name: Verify downloads
        shell: bash
        run: |
          set -euo pipefail
          find release-artifacts -type f | sort
          test -n "$(find release-artifacts -type f -print -quit)"

      - name: Check whether release exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release if missing
        if: ${{ steps.release_check.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.tag }}" \
            --notes "Release assets uploaded from workflow run ${{ inputs.run_id }}."
    
      - name: Get app metadata
        id: app_meta
        shell: bash
        run: |
          set -euo pipefail
      
          VERSION=$(awk -F'"' '/"version": ".+"/ { print $4; exit }' "$GITHUB_WORKSPACE/package.json")
          APP_NAME=$(awk -F'"' '/"productName": ".+"/ { print $4; exit }' "$GITHUB_WORKSPACE/package.json")
          APP_FILE_NAME=${APP_NAME// /.}
      
          {
            echo "version=$VERSION"
            echo "app_name=$APP_NAME"
            echo "app_file_name=$APP_FILE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Upload files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.app_meta.outputs.version }}
          APP_FILE_NAME: ${{ steps.app_meta.outputs.app_file_name }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          prefix="${APP_FILE_NAME}-${VERSION}-"
          
          # while IFS= read -r -d '' file; do
          #   found=1
          #   gh release upload "${{ inputs.tag }}" "$file" \
          #     --repo "${{ github.repository }}" \
          #     --clobber
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            case "$base" in
              "${prefix}"*)
                found=1
                gh release upload "${{ inputs.tag }}" "$file" \
                  --repo "${{ github.repository }}" \
                  --clobber
                ;;
            esac    
          done < <(
            find release-artifacts -type f \
              \( -name '*.zip' -o -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
              -print0
          )

          if [ "$found" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

      - name: Show release URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --json url \
            --jq '.url'
