name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            os: macos-13
            build_cmd: pnpm exec electron-builder build --mac zip --x64 --publish never
            artifact_name: my-doryoku-log-mac-x64

          - name: macOS arm64
            os: macos-latest
            build_cmd: pnpm exec electron-builder build --mac zip --arm64 --publish never
            artifact_name: my-doryoku-log-mac-arm64

          - name: Windows x64
            os: windows-latest
            build_cmd: pnpm exec electron-builder build --win nsis --x64 --publish never
            artifact_name: my-doryoku-log-win-x64

          - name: Linux x64
            os: ubuntu-latest
            build_cmd: pnpm exec electron-builder build --linux AppImage --x64 --publish never
            artifact_name: my-doryoku-log-linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Verify versions
        shell: bash
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm run prepare

      - name: Generate Drizzle migrations
        run: pnpm run db:generate

      - name: Rebuild native modules
        run: pnpm rebuild

      - name: Package app
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-electron/**/*

  attach-to-release:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Attach files to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-assets/**/*