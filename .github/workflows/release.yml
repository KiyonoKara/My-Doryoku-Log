name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-mac-x64:
    name: macOS x64
    runs-on: macos-13
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install pnpm
        shell: bash
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=11.1.2 SHELL="$(which bash)" bash -
          echo "PNPM_HOME=$HOME/.local/share/pnpm" >> "$GITHUB_ENV"
          echo "$HOME/.local/share/pnpm" >> "$GITHUB_PATH"

      - name: Verify tool versions
        shell: bash
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm run prepare

      - name: Generate Drizzle migrations
        run: pnpm run db:generate

      - name: Rebuild native modules
        run: pnpm rebuild

      - name: Package macOS x64
        run: pnpm exec electron-builder build --mac zip --x64 --publish never

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-doryoku-log-mac-x64
          path: dist-electron/**/*

  build-mac-arm64:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install pnpm
        shell: bash
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=11.1.2 SHELL="$(which bash)" bash -
          echo "PNPM_HOME=$HOME/.local/share/pnpm" >> "$GITHUB_ENV"
          echo "$HOME/.local/share/pnpm" >> "$GITHUB_PATH"

      - name: Verify tool versions
        shell: bash
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm run prepare

      - name: Generate Drizzle migrations
        run: pnpm run db:generate

      - name: Rebuild native modules
        run: pnpm rebuild

      - name: Package macOS arm64
        run: pnpm exec electron-builder build --mac zip --arm64 --publish never

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-doryoku-log-mac-arm64
          path: dist-electron/**/*

  build-win-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install pnpm
        shell: powershell
        run: |
          Invoke-WebRequest https://get.pnpm.io/install.ps1 -UseBasicParsing | Invoke-Expression
          echo "PNPM_HOME=$env:USERPROFILE\AppData\Local\pnpm" >> $env:GITHUB_ENV
          echo "$env:USERPROFILE\AppData\Local\pnpm" >> $env:GITHUB_PATH

      - name: Verify tool versions
        shell: powershell
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm run prepare

      - name: Generate Drizzle migrations
        run: pnpm run db:generate

      - name: Rebuild native modules
        run: pnpm rebuild

      - name: Package Windows x64
        run: pnpm exec electron-builder build --win nsis --x64 --publish never

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-doryoku-log-win-x64
          path: dist-electron/**/*

  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install pnpm
        shell: bash
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=11.1.2 SHELL="$(which bash)" bash -
          echo "PNPM_HOME=$HOME/.local/share/pnpm" >> "$GITHUB_ENV"
          echo "$HOME/.local/share/pnpm" >> "$GITHUB_PATH"

      - name: Verify tool versions
        shell: bash
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm run prepare

      - name: Generate Drizzle migrations
        run: pnpm run db:generate

      - name: Rebuild native modules
        run: pnpm rebuild

      - name: Package Linux x64
        run: pnpm exec electron-builder build --linux AppImage --x64 --publish never

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-doryoku-log-linux-x64
          path: dist-electron/**/*

  attach-to-release:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-mac-x64
      - build-mac-arm64
      - build-win-x64
      - build-linux-x64
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Attach files to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-assets/**/*